name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Check macOS Seatbelt
        run: |
          profile='(version 1) (deny default) (allow file-read*) (allow file-map-executable) (allow process-exec*)'
          if ! test -x /usr/bin/sandbox-exec || ! /usr/bin/sandbox-exec -p "$profile" /usr/bin/true; then
            echo "::error::macOS sandbox-exec is unavailable or refused a minimal Seatbelt profile"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reject in-source credential defaults
        run: python tools/check_no_credential_defaults.py bot.py config.py ledger.py authz.py outcome.py deadlines.py run_workspace.py workspace_io.py steering.py session_log.py run_state.py tool_sandbox.py tool_worker.py tools

      - name: Compile
        run: python -m compileall -q bot.py config.py ledger.py authz.py outcome.py deadlines.py run_state.py run_workspace.py workspace_io.py steering.py session_log.py tool_sandbox.py tool_worker.py tools

      - name: Tests
        run: python -m unittest discover -v
